{{- range $name, $service := .Values.services }}
{{- if and (ne $name "frontend") (ne $name "gateway") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexushr-{{ $name }}-hpa
  namespace: {{ $.Values.namespace }}
spec:
  scaleTargetRef:
  apiVersion: apps/v1
  kind: Deployment
  name: nexushr-{{ $name }}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
{{- end }}
{{- end }}
