server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/employees/**
        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/attendance/**
        - id: leave-service
          uri: ${LEAVE_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/leave/**
        - id: payroll-service
          uri: ${PAYROLL_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/payroll/**
        - id: performance-service
          uri: ${PERFORMANCE_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/performance/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/ai/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
